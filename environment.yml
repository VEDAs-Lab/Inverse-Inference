name: slimia-ipp
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.12
  - tqdm
  - joblib
  - pyyaml
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1   # remove/adjust if running CPU-only
  - pip:
      - tifffile>=2023.7.10
      - Pillow>=10.0.0
      - opencv-python>=4.8.0
      - scikit-image>=0.21.0
      - albumentations>=1.3.1
      - timm>=0.9.12
      - segmentation-models-pytorch>=0.3.3
      - einops>=0.7.0
      - pytorch-msssim>=1.0.0
      - grad-cam>=1.5.0